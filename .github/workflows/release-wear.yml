name: Release Wear OS APK

# Tag a release to publish an installable APK:
#   git tag wear-v1.0.0 && git push origin wear-v1.0.0
#
# Signing is driven by repository secrets. When they are absent the job still
# runs and uploads the unsigned APK as a build artifact, but it will not create
# a GitHub Release — an unsigned APK cannot be installed, so publishing one
# would be misleading.
on:
  push:
    tags:
      - 'wear-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create a GitHub Release from this run'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wear

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WEAR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.WEAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WEAR_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No WEAR_KEYSTORE_BASE64 secret — release APK will be unsigned."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble release
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the artifact
        id: apk
        run: |
          src=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$src" || { echo "No APK produced"; exit 1; }
          ver="${GITHUB_REF_NAME#wear-v}"
          [ "$ver" = "$GITHUB_REF_NAME" ] && ver="$GITHUB_SHA"
          out="aibou-wear-${ver}.apk"
          [ "${{ steps.signing.outputs.signed }}" = "true" ] || out="aibou-wear-${ver}-UNSIGNED.apk"
          cp "$src" "$out"
          echo "path=wear/$out" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.signing.outputs.signed == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            ## Aibou for Wear OS

            Standalone Wear OS app. Requires the Aibou Bridge running on your
            own machine — the watch talks to it directly over Wi-Fi.

            ### Install

            ```bash
            adb install -r ${{ steps.apk.outputs.name }}
            ```

            Sideloading to a physical watch needs developer options and ADB
            debugging enabled on the watch (Settings → Developer options).

            ### Requirements

            - Wear OS 3 or later (minSdk 30)
            - Watch on the same network as the machine running the Bridge
            - Bridge started with `--host 0.0.0.0` for LAN access

            See the [README](https://github.com/${{ github.repository }}#readme)
            for pairing and the Bridge setup.
